# EverBright MIS — GitHub Actions auto-deploy to Firebase
# Triggers on every push to main branch.
# Auth uses a Firebase service account JSON stored as a GitHub secret
# (named FIREBASE_SERVICE_ACCOUNT_EVERBRIGHT_MIS_DEV). No CLI install needed locally.

name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVERBRIGHT_MIS_DEV }}' > "${{ github.workspace }}/sa.json"

      - name: Deploy to Firebase (Hosting + Rules + Indexes)
        run: firebase deploy --only hosting,firestore:rules,firestore:indexes --project everbright-mis-dev
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/sa.json

      - name: Clean up key
        if: always()
        run: rm -f "${{ github.workspace }}/sa.json"

<body>
  <div id="app-root">
    <!-- Rendered by app.js → Login / AppShell -->
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Firebase SDK (Compat CDN) -->
  <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts (load order matters) -->
  <script src="/js/firebase-init.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/data-service.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/views-management.js"></script>
  <script src="/js/views-adviser.js"></script>

  <!-- Toast render hook -->
  <script>
    // Override showToast to render DOM element
    showToast = function(msg, type) {
      const el = document.getElementById('toast-container') || document.body;
      const existing = el.querySelector('.toast');
      if (existing) existing.remove();
      const div = document.createElement('div');
      div.className = 'toast' + (type === 'error' ? ' error' : '');
      div.textContent = msg;
      el.appendChild(div);
      if (S.toastTimer) clearTimeout(S.toastTimer);
      S.toastTimer = setTimeout(() => div.remove(), 3000);
    };
  </script>
</body>
